name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ "main" ] # 当 main 分支有提交时自动触发

permissions:
  contents: write # 赋予配置打包产物分支的写权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安装依赖
      - name: Install Dependencies
        run: npm ci

      # 4. 代码检查 (如无需检查可删掉这行)
      - name: Lint Code
        run: npm run lint

      # 5. 打包构建
      - name: Build Project
        run: npm run build

      # 6. 部署静态文件到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist