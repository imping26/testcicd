name: Deploy to GitHub Pages

# 这条流水线只在代码【已经进入 main】之后跑，负责发布。
on:
  push:
    branches: ["main"]
  workflow_dispatch: # 允许你在 Actions 页面手动点一下就重新部署

# 官方 Pages 部署需要这三个权限：
permissions:
  contents: read # 读代码
  pages: write # 写 Pages
  id-token: write # 用 OIDC 身份验证，不再需要手动传 token

# 避免两次部署同时进行把线上搞乱。注意这里 cancel-in-progress 是 false：
# 部署不能中途取消，否则线上可能停在半成品状态。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一个 job：构建，产出 artifact
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # 这里再跑一遍 lint/test，是故意的：
      # 万一有人绕过 PR 直接 push 到 main，这是最后一道防线。
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 把 dist/ 打包成一个 artifact 交给下一个 job，不再 commit 到 gh-pages 分支
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 第二个 job：部署。needs: build 表示必须等 build 成功才开始。
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    # 声明成 environment 后，GitHub 会记录每次部署历史，可以看到线上是哪个版本、能回滚
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
